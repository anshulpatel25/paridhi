name: Build and Publish Docker Image

# This workflow strictly executes ONLY when a release tag is pushed,
# or when manually dispatched with a specific tag input.
# It does NOT execute on pushes to the main branch.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

# Ensure least-privilege permissions
permissions:
  contents: read
  packages: write # Required to push container images to GitHub Container Registry (ghcr.io)

jobs:
  docker-publish:
    name: Build, Security Scan & Publish ARM64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Version & Tag
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
          else
            INPUT_TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading 'v' to extract raw semantic version number
          RAW_VERSION="${INPUT_TAG#v}"

          echo "Target Release Tag: $INPUT_TAG"
          echo "Semantic Version Input: $RAW_VERSION"

          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      # ========================================================================
      # Stage 1: Python Environment Setup & Dependency Installation
      # ========================================================================
      - name: Install uv package manager
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python runtime
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies with uv
        run: |
          echo "Syncing all dependencies for vulnerability and license inspection..."
          uv sync --all-groups
          echo "Exporting dependencies for Trivy license inspection..."
          uv export --format requirements-txt --all-groups --output-file requirements.txt

      # ========================================================================
      # Stage 2: Trivy Analysis on Python Packages (Vuln, SBOM & Licenses)
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Python Packages
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-python-vuln.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Generate Python SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom-python.spdx.json'

      - name: Generate Python License Report with Trivy
        uses: aquasecurity/trivy-action@master
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          output: 'trivy-python-license.txt'
          exit-code: '0'

      # ========================================================================
      # Stage 3: Build Local ARM64 Image for Scanning & Testing
      # ========================================================================
      - name: Set up QEMU for multi-platform support
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local ARM64 Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: paridhi:local
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================================
      # Stage 4: Perform Trivy Analysis, SBOM & License Audit on Local Image
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Local Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          format: 'table'
          output: 'trivy-docker-vuln.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Generate SBOM from Local Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          format: 'spdx-json'
          output: 'sbom-docker.spdx.json'

      - name: Generate Docker License Report with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          scanners: 'license'
          format: 'table'
          output: 'trivy-docker-license.txt'
          exit-code: '0'

      - name: Upload Security, SBOM & License Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-and-sbom-paridhi-${{ steps.version.outputs.version }}
          path: |
            sbom-python.spdx.json
            sbom-docker.spdx.json
            trivy-python-vuln.txt
            trivy-python-license.txt
            trivy-docker-vuln.txt
            trivy-docker-license.txt
          retention-days: 90

      # ========================================================================
      # Stage 5: Build & Publish Actual Image to Registry
      # Executes only after local build, security analysis, SBOM & license succeed
      # ========================================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Paridhi
            org.opencontainers.image.description=FastMCP server for discovering and enriching points of interest within circular spatial bounds
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and Push Docker image to ghcr.io (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      # ========================================================================
      # Stage 6: Post Security, SBOM & License Report to GitHub Actions Run Summary
      # ========================================================================
      - name: Generate GitHub Actions Run Summary
        if: always()
        run: |
          set -euo pipefail

          SUMMARY_FILE="summary.md"

          # Helper to safely extract Report Summary table from a trivy text file
          extract_report_summary() {
            local file="$1"
            if [ -f "$file" ] && [ -s "$file" ]; then
              sed -n '/Report Summary/,/Clean (no security findings detected)/p' "$file" | head -n 25
            fi
          }

          # Helper to extract Total summary line
          extract_total_line() {
            local file="$1"
            if [ -f "$file" ] && [ -s "$file" ]; then
              grep "^Total:" "$file" || true
            fi
          }

          {
            echo "# 🛡️ Security Vulnerabilities, SBOM & License Compliance Report"
            echo ""
            echo "### 📋 Build & Target Overview"
            echo "| Attribute | Value |"
            echo "| :--- | :--- |"
            echo "| **Published Image** | \`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\` |"
            echo "| **Release Tag** | \`${{ steps.version.outputs.tag }}\` |"
            echo "| **Target Architecture** | \`linux/arm64\` |"
            echo "| **Scanner Engine** | [Aquasecurity Trivy](https://github.com/aquasecurity/trivy-action) |"
            echo "| **SBOM Format** | SPDX 2.3 JSON (\`sbom-python.spdx.json\`, \`sbom-docker.spdx.json\`) |"
            echo "| **Full Reports Artifact** | \`security-and-sbom-paridhi-${{ steps.version.outputs.version }}\` |"
            echo ""
            echo "---"
            echo ""
            echo "## 🐍 1. Python Packages Security & Compliance"
            echo ""
            echo "### 📦 Software Bill of Materials (SBOM)"
            if [ -f sbom-python.spdx.json ] && [ -s sbom-python.spdx.json ]; then
              echo "✅ **SPDX 2.3 JSON SBOM generated**: \`sbom-python.spdx.json\` *(downloadable in workflow artifacts)*"
            else
              echo "⚠️ Python SBOM generation did not produce an output file."
            fi
            echo ""
            echo "### 🔍 Vulnerability Status"
            PY_VULN_TOTAL=$(extract_total_line trivy-python-vuln.txt)
            if [ -n "$PY_VULN_TOTAL" ]; then
              echo "> **Findings**: \`$PY_VULN_TOTAL\`"
              echo ""
              echo "<details open>"
              echo "<summary><b>Click to view vulnerability findings</b></summary>"
              echo ""
              echo "\`\`\`text"
              grep -E "CRITICAL|HIGH|MEDIUM|LOW" trivy-python-vuln.txt | head -n 40 || true
              echo "\`\`\`"
              echo "</details>"
            else
              echo "✅ **No vulnerabilities detected in Python dependencies.**"
              echo ""
              PY_VULN_SUMMARY=$(extract_report_summary trivy-python-vuln.txt)
              if [ -n "$PY_VULN_SUMMARY" ]; then
                echo "\`\`\`text"
                echo "$PY_VULN_SUMMARY"
                echo "\`\`\`"
              fi
            fi
            echo ""
            echo "### 📜 License Compliance"
            PY_LIC_TOTAL=$(extract_total_line trivy-python-license.txt)
            if [ -n "$PY_LIC_TOTAL" ]; then
              echo "> **Summary**: \`$PY_LIC_TOTAL\`"
              echo ""
            fi
            PY_FLAGGED_LIC=$(grep -E "unknown|restricted|forbidden|HIGH|CRITICAL" trivy-python-license.txt | grep -v "^Total:" | head -n 30 || true)
            if [ -n "$PY_FLAGGED_LIC" ]; then
              echo "#### Non-standard or Flagged Package Licenses (Review Recommended)"
              echo "\`\`\`text"
              echo "$PY_FLAGGED_LIC"
              echo "\`\`\`"
            else
              echo "✅ All Python dependencies use standard permissive licenses."
            fi
            echo ""
            echo "> ℹ️ *Complete manifest of all Python package licenses is preserved in workflow artifact \`trivy-python-license.txt\`.*"
            echo ""
            echo "---"
            echo ""
            echo "## 🐳 2. Docker Container Security & Compliance"
            echo ""
            echo "### 📦 Software Bill of Materials (SBOM)"
            if [ -f sbom-docker.spdx.json ] && [ -s sbom-docker.spdx.json ]; then
              echo "✅ **SPDX 2.3 JSON SBOM generated**: \`sbom-docker.spdx.json\` *(downloadable in workflow artifacts)*"
            else
              echo "⚠️ Docker SBOM generation did not produce an output file."
            fi
            echo ""
            echo "### 🔍 Vulnerability Status (\`paridhi:local\` ARM64)"
            DOCKER_VULN_TOTAL=$(extract_total_line trivy-docker-vuln.txt)
            if [ -n "$DOCKER_VULN_TOTAL" ]; then
              echo "> **Findings**: \`$DOCKER_VULN_TOTAL\`"
              echo ""
              echo "<details open>"
              echo "<summary><b>Click to view top container vulnerabilities</b></summary>"
              echo ""
              echo "\`\`\`text"
              grep -E "CRITICAL|HIGH|MEDIUM|LOW" trivy-docker-vuln.txt | head -n 40 || true
              echo "\`\`\`"
              echo "</details>"
            else
              echo "✅ **No vulnerabilities detected in local ARM64 container image.**"
              echo ""
              DOCKER_VULN_SUMMARY=$(extract_report_summary trivy-docker-vuln.txt)
              if [ -n "$DOCKER_VULN_SUMMARY" ]; then
                echo "\`\`\`text"
                echo "$DOCKER_VULN_SUMMARY"
                echo "\`\`\`"
              fi
            fi
            echo ""
            echo "### 📜 License Compliance"
            DOCKER_LIC_TOTAL=$(extract_total_line trivy-docker-license.txt)
            if [ -n "$DOCKER_LIC_TOTAL" ]; then
              echo "> **OS & Container Package Licenses**: \`$DOCKER_LIC_TOTAL\`"
              echo ""
            fi
            DOCKER_FLAGGED_LIC=$(grep -E "forbidden|CRITICAL" trivy-docker-license.txt | grep -v "^Total:" | head -n 20 || true)
            if [ -n "$DOCKER_FLAGGED_LIC" ]; then
              echo "#### High-Risk/Forbidden Licenses"
              echo "\`\`\`text"
              echo "$DOCKER_FLAGGED_LIC"
              echo "\`\`\`"
            else
              echo "✅ No forbidden or critical license violations detected in container."
            fi
            echo ""
            echo "> ℹ️ *Base Debian image packages include standard system libraries (e.g. GPL/LGPL/BSD/MIT). The complete container license audit is preserved in workflow artifact \`trivy-docker-license.txt\`.*"
          } > "$SUMMARY_FILE"

          # Safety check: ensure total summary size is well below 1024 KiB limit (cap at 256 KiB)
          SUMMARY_BYTES=$(wc -c < "$SUMMARY_FILE")
          echo "Generated step summary size: ${SUMMARY_BYTES} bytes"
          if [ "$SUMMARY_BYTES" -gt 262144 ]; then
            head -c 260000 "$SUMMARY_FILE" > "${SUMMARY_FILE}.tmp"
            echo -e "\n\n> ⚠️ *Summary truncated due to size limit. Full raw reports are available in workflow artifacts.*" >> "${SUMMARY_FILE}.tmp"
            mv "${SUMMARY_FILE}.tmp" "$SUMMARY_FILE"
          fi

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
