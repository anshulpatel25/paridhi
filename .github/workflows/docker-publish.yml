name: Build and Publish Docker Image

# This workflow strictly executes ONLY when a release tag is pushed,
# or when manually dispatched with a specific tag input.
# It does NOT execute on pushes to the main branch.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

# Ensure least-privilege permissions
permissions:
  contents: read
  packages: write # Required to push container images to GitHub Container Registry (ghcr.io)

jobs:
  docker-publish:
    name: Build, Security Scan & Publish ARM64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Version & Tag
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
          else
            INPUT_TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading 'v' to extract raw semantic version number
          RAW_VERSION="${INPUT_TAG#v}"

          echo "Target Release Tag: $INPUT_TAG"
          echo "Semantic Version Input: $RAW_VERSION"

          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      # ========================================================================
      # Stage 1: Python Environment Setup & Dependency Installation
      # ========================================================================
      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies with uv
        run: |
          echo "Syncing all dependencies for vulnerability and license inspection..."
          uv sync --all-groups
          echo "Exporting dependencies for Trivy license inspection..."
          uv export --format requirements-txt --all-groups --output-file requirements.txt

      # ========================================================================
      # Stage 2: Trivy Analysis on Python Packages (Vuln, SBOM & Licenses)
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Python Packages
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-python-vuln.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Generate Python SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom-python.spdx.json'

      - name: Generate Python License Report with Trivy
        uses: aquasecurity/trivy-action@master
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          output: 'trivy-python-license.txt'
          exit-code: '0'

      # ========================================================================
      # Stage 3: Build Local ARM64 Image for Scanning & Testing
      # ========================================================================
      - name: Set up QEMU for multi-platform support
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: paridhi:local
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========================================================================
      # Stage 4: Perform Trivy Analysis, SBOM & License Audit on Local Image
      # ========================================================================
      - name: Run Trivy Vulnerability Scanner on Local Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          format: 'table'
          output: 'trivy-docker-vuln.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Generate SBOM from Local Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          format: 'spdx-json'
          output: 'sbom-docker.spdx.json'

      - name: Generate Docker License Report with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'paridhi:local'
          scan-type: 'image'
          scanners: 'license'
          format: 'table'
          output: 'trivy-docker-license.txt'
          exit-code: '0'

      - name: Upload Security, SBOM & License Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-and-sbom-paridhi-${{ steps.version.outputs.version }}
          path: |
            sbom-python.spdx.json
            sbom-docker.spdx.json
            trivy-python-vuln.txt
            trivy-python-license.txt
            trivy-docker-vuln.txt
            trivy-docker-license.txt
          retention-days: 90

      # ========================================================================
      # Stage 5: Build & Publish Actual Image to Registry
      # Executes only after local build, security analysis, SBOM & license succeed
      # ========================================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Paridhi
            org.opencontainers.image.description=FastMCP server for discovering and enriching points of interest within circular spatial bounds
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and Push Docker image to ghcr.io (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      # ========================================================================
      # Stage 6: Post Security, SBOM & License Report to GitHub Actions Run Summary
      # ========================================================================
      - name: Generate GitHub Actions Run Summary
        if: always()
        run: |
          set -euo pipefail

          {
            echo "# 🛡️ Security Vulnerabilities, SBOM & License Compliance Report"
            echo ""
            echo "### 📋 Build & Target Overview"
            echo "| Attribute | Value |"
            echo "| :--- | :--- |"
            echo "| **Published Image** | \`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\` |"
            echo "| **Release Tag** | \`${{ steps.version.outputs.tag }}\` |"
            echo "| **Target Architecture** | \`linux/arm64\` |"
            echo "| **Scanner Engine** | [Aquasecurity Trivy](https://github.com/aquasecurity/trivy-action) |"
            echo "| **SBOM Format** | SPDX 2.3 JSON (\`sbom-python.spdx.json\`, \`sbom-docker.spdx.json\`) |"
            echo ""
            echo "---"
            echo ""
            echo "## 🐍 1. Python Packages Security & Compliance"
            echo ""
            echo "### 📦 Software Bill of Materials (SBOM)"
            if [ -f sbom-python.spdx.json ] && [ -s sbom-python.spdx.json ]; then
              echo "✅ **Python SBOM successfully generated**: \`sbom-python.spdx.json\`"
            else
              echo "⚠️ Python SBOM generation did not produce an output file."
            fi
            echo ""
            echo "### 🔍 Vulnerability Findings"
            if [ -f trivy-python-vuln.txt ] && [ -s trivy-python-vuln.txt ]; then
              echo "<details open>"
              echo "<summary><b>Click to view Python package vulnerability report</b></summary>"
              echo ""
              echo "\`\`\`text"
              cat trivy-python-vuln.txt
              echo "\`\`\`"
              echo "</details>"
            else
              echo "✅ No Python vulnerabilities detected."
            fi
            echo ""
            echo "### 📜 License Compliance"
            if [ -f trivy-python-license.txt ] && [ -s trivy-python-license.txt ]; then
              PY_LIC_SUMMARY=$(grep "^Total:" trivy-python-license.txt || true)
              if [ -n "$PY_LIC_SUMMARY" ]; then
                echo "> **Summary**: \`$PY_LIC_SUMMARY\`"
                echo ""
              fi
              echo "<details>"
              echo "<summary><b>Click to view Python package licenses</b></summary>"
              echo ""
              echo "\`\`\`text"
              cat trivy-python-license.txt
              echo "\`\`\`"
              echo "</details>"
            else
              echo "⚠️ Python license report not available."
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 🐳 2. Docker Container Security & Compliance"
            echo ""
            echo "### 📦 Software Bill of Materials (SBOM)"
            if [ -f sbom-docker.spdx.json ] && [ -s sbom-docker.spdx.json ]; then
              echo "✅ **Docker Image SBOM successfully generated**: \`sbom-docker.spdx.json\`"
            else
              echo "⚠️ Docker SBOM generation did not produce an output file."
            fi
            echo ""
            echo "### 🔍 Vulnerability Findings (Local ARM64 Image \`paridhi:local\`)"
            if [ -f trivy-docker-vuln.txt ] && [ -s trivy-docker-vuln.txt ]; then
              DOCKER_VULN_SUMMARY=$(grep "^Total:" trivy-docker-vuln.txt || true)
              if [ -n "$DOCKER_VULN_SUMMARY" ]; then
                echo "> **Summary**: \`$DOCKER_VULN_SUMMARY\`"
                echo ""
              fi
              echo "<details open>"
              echo "<summary><b>Click to view Docker container vulnerability report</b></summary>"
              echo ""
              echo "\`\`\`text"
              cat trivy-docker-vuln.txt
              echo "\`\`\`"
              echo "</details>"
            else
              echo "✅ No container vulnerabilities detected."
            fi
            echo ""
            echo "### 📜 License Compliance"
            if [ -f trivy-docker-license.txt ] && [ -s trivy-docker-license.txt ]; then
              echo "<details>"
              echo "<summary><b>Click to view Docker container licenses</b></summary>"
              echo ""
              echo "\`\`\`text"
              cat trivy-docker-license.txt
              echo "\`\`\`"
              echo "</details>"
            else
              echo "⚠️ Docker license report not available."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
