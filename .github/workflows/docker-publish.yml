name: Build and Publish Docker Image

# This workflow strictly executes ONLY when a release tag is pushed,
# or when manually dispatched with a specific tag input.
# It does NOT execute on pushes to the main branch.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        type: string

# Ensure least-privilege permissions
permissions:
  contents: read
  packages: write # Required to push container images to GitHub Container Registry (ghcr.io)

jobs:
  docker-publish:
    name: Build & Publish OCI Container
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Target Version & Tag
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
          else
            INPUT_TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading 'v' to extract raw semantic version number
          RAW_VERSION="${INPUT_TAG#v}"

          echo "Target Release Tag: $INPUT_TAG"
          echo "Semantic Version Input: $RAW_VERSION"

          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Paridhi
            org.opencontainers.image.description=FastMCP server for discovering and enriching points of interest within circular spatial bounds
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
